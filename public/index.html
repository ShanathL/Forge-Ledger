<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b132b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ForgeLedger - Integrated Manufacturing Workspace</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <!-- React & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body>
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #0b132b; color: #fff; font-family: sans-serif;">
      <div style="text-align: center;">
        <img src="/logo.png" alt="ForgeLedger" style="width: 68px; height: 68px; border-radius: 16px; margin: 0 auto 16px; display: block; box-shadow: 0 4px 20px rgba(0,0,0,0.5);" />
        <div style="font-size: 32px; font-weight: 800; margin-bottom: 8px; color: #3b82f6;">ForgeLedger</div>
        <div style="font-size: 14px; color: #94a3b8;">Loading Manufacturing Workspace...</div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
